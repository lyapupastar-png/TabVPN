name: Build macOS installer

# Собирает TabVPN.pkg: fetch-tor.sh -> build-native-host.sh -> build-pkg.sh
# Ничего не подписывается Apple Developer ID (осознанное решение) —
# только ad-hoc подпись бинарей native-host внутри build-native-host.sh,
# без которой их убивает ядро macOS при запуске.

on:
  push:
    branches: [main]
    paths:
      - 'installer/macos/**'
      - 'native-host/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 20 (не 18/22): по документации @yao-pkg/pkg кросс-компиляция
          # под другую архитектуру с одного хоста поддержана на Node 20
          # и 24, у Node 22 в этом режиме известна регрессия.
          node-version: '20'

      - name: Fetch Tor binary
        run: |
          chmod +x installer/macos/fetch-tor.sh
          ./installer/macos/fetch-tor.sh "${{ github.workspace }}/build"

      - name: Build native-host binaries
        run: |
          chmod +x installer/macos/build-native-host.sh
          ./installer/macos/build-native-host.sh "${{ github.workspace }}/build"

      - name: Build .pkg
        run: |
          chmod +x installer/macos/build-pkg.sh
          ./installer/macos/build-pkg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabVPN-macos-pkg
          path: build/TabVPN.pkg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TabVPN.pkg
